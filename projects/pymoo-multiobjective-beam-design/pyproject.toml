[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymoo-multiobjective-beam-design"
version = "0.1.0"
description = "Multi-objective cantilever beam design with pymoo NSGA-II"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pymoo==0.6.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
pymoo-beam = "pymoo_beam.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
